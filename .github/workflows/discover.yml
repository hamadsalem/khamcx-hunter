name: Solana Momentum Discovery

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:  # allow manual trigger

# Prevent multiple runs from overlapping
concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore database from previous run
        uses: actions/cache@v4
        with:
          path: momentum_bot.db
          key: momentum-db-${{ github.run_id }}
          restore-keys: |
            momentum-db-

      - name: Run discovery (polling mode, 4 minutes)
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_DURATION_SECONDS: '240'
          POLL_MODE: 'true'
        run: |
          python main.py || true

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_id }}
          path: |
            momentum_bot.log
            momentum_bot.db
          retention-days: 7
