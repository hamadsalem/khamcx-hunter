name: KHAMCX Hunter

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install aiohttp

      - name: Run hunter
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
        run: timeout 90 python discovery.py || true

      - name: Commit signals
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add khamcx_signals.jsonl khamcx_seen.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update KHAMCX signals"
          git push || true
